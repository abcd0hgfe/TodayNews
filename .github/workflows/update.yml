name: 뉴스 대시보드 자동 업데이트

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← 이 3줄 추가

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install feedparser google-genai --upgrade

      - name: 뉴스 수집 및 HTML 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add index.html
          git diff --cached --quiet || git commit -m "뉴스 업데이트: $(date '+%Y-%m-%d %H:%M') KST"
          git push
